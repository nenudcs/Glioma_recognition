# 20 epoch 训练配置（赛道4）★ 当前采用的方案
# ----------------------------------------------------------------------------
# 与 configs/train.yaml 完全一致，**只把 epochs 从 100 改成 20**。
#
# 当前方案：**训练集按 8:2 固定折内划分**，训 20 个 epoch。
#   为什么不用"全量训练"（`--fold full`）：官方验证集实测 777 例、**带掩膜的 0 例**，
#   而 `--fold full` 必须用验证集掩膜算 Dice 来选 best，会当场报错。
#   折内划分的 val 来自**训练集**（有掩膜、也有字段金标准），所以分割与字段指标都算得了。
#
# 用法：
#
#   export DATASET_ROOT=/2026aicompetition/datasets/training/annotation
#   bash scripts/01_probe.sh                 # → data/manifest.json
#   bash scripts/02_build_dataset.sh         # → data/folds.json（**固定划分**，只建一次）
#   CONFIG=train20 bash scripts/03_train.sh 0
#   → checkpoints/g4_fold0/best.pth          （train 80% / val 20%）
#   → 收尾：FOLDS="0" bash scripts/16_finalize.sh
#
# 8:2 是怎么来的：
#   · 切分由 `folds: 5` 决定 —— 每折的 val ≈ 全集 1/5 = 20%，train = 其余 80%；
#   · `val_ratio: 0.2` 在当前 `build_folds` 实现里**不参与切分**，保留它只是与该口径
#     保持一致（改动它不会让划分变成别的比例）；
#   · 划分结果**落盘在 `data/folds.json`**，之后每次启动都复用它 →
#     同一次实验、重启/续训后 val 都是**同一批病例**（这就是"固定划分"）。
#   ⚠️ 不要手工覆盖 `data/folds.json`：换了划分，已训练的权重就与它的训练集不再对应
#      （旧折 train 与新折 val 会大范围重叠 → 评估泄漏）。
#
# 说明：
#   · 训练侧 epoch 数在**本文件**；03_train.sh 只透传 --config，没有 --epochs 参数。
#   · OneCycleLR 的 total_steps = epochs × steps_per_epoch，跟着这里同步缩短。
#   · 想换回 100 epoch：用 CONFIG=train（默认）即可，本文件不影响它。
# ----------------------------------------------------------------------------
seed: 42
epochs: 20
batch_size: 2
patch_size: [96, 96, 96]        # 训练 patch；显存不足降到 80³ 或 batch 1
lr: 3.0e-4
weight_decay: 3.0e-5
amp_dtype: bfloat16             # 平台镜像 CUDA12.8 支持 bf16
ema_decay: 0.999
grad_clip: 12.0
num_workers: 4
val_every: 1                    # 全量模式下 val=官方验证集，例数多时可改成 2 提速
folds: 5                        # 多折交叉验证（平台 4 容器上限 → 4 折并行 + 第 5 折后补）
val_ratio: 0.2
threshold_grid: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
                 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
checkpoint_metric: val_dice_peri   # 选模指标（val_dice_mean 亦可）

# ---- 骨干（MedNeXt 风格：深度可分离大核 + GRN；arch=resunet 可回退轻量版）----
model:
  arch: mednext
  base: 32
  depth: 4
  blocks_per_stage: 2
  k: 3                          # 深度可分离卷积核（3 或 5）
  expand: 2
  dropout: 0.0
  aniso_z: false                # true 时第一级下采样在 z 轴更激进（层厚大时可用）

sampler:
  pos_ratio: 0.7                # 每个 batch 中含病灶 patch 的比例

# ---- 数据增广（小样本泛化的主要来源，这类脑肿瘤分割任务通常 +2~4 Dice）----
augment:
  enabled: true
  flip_prob: 0.5                # 三轴随机翻转
  rot_xy_prob: 0.7              # 90° 平面旋转（x-y 或 y-z）
  scale_prob: 0.25              # 随机缩放（几何）
  scale_range: 0.12
  elastic_prob: 0.25            # 弹性形变
  elastic_alpha: 2.0
  elastic_sigma: 8.0
  intensity_prob: 0.8           # gamma / 尺度 / 位移
  gamma_range: 0.25
  scale_range_i: 0.15
  shift_range: 0.15
  bias_prob: 0.2                # 模拟偏置场
  bias_strength: 0.25
  noise_prob: 0.3               # 高斯噪声
  noise_std: 0.08

# ---- 全局视图（分类 / 特殊影像 / 重复影像嵌入）----
# 训练与推理必须使用**相同的物理尺寸与边长**，否则尺度分布不一致会让结构头退化
global_view:
  size_mm: 192                  # 物理立方体边长（覆盖全脑）
  out: 96                       # 缩放到 96³（与 preprocess.inference.global_size 一致）
  every: 4                      # 每 N 步做一次全局头前向（控制训练开销）

# ---- 辅助任务（目标一/二，属于基础考核项，必须真正训练）----
aux:
  special_batch: 2              # 每步特殊影像（假人体/拼接）样本数
  pair_batch: 2                 # 每步重复影像配对数
  neg_per_pos: 3                # 配对负样本比例

# ---- 多任务损失权重 ----
loss:
  dice: 1.0
  ce: 1.0
  deep_sup: 0.4                 # 深监督（多尺度）
  cls: 1.0                      # 结构化字段（仅在有金标准的样本上回传）
  special: 1.0                  # 目标一二：假人体 / 拼接
  embed: 0.3                    # 目标一二：重复影像嵌入
  contain: 0.2                  # 集合约束：core ⊆ peri
  boundary: 0.0                 # 边界加权（>0 时启用，改善 NSD/HD95）
  seg_pos_weight: 1.0           # 分割正类权重（病灶极小时可调大）
  cls_pos_weight: 2.0           # 分类正类权重（类别不平衡）
  embed_scale: 10.0             # 余弦相似度 logit 缩放

infer:
  use_ema: true                 # 推理默认用 EMA 权重（更稳）
  ensemble: true                # 多折集成
